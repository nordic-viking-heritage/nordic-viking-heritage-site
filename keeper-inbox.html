<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Keeper's Inbox — Preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#061014;--gold:#c9a35b;--text:#f1eadb;--muted:#b8ae9e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}.wrap{width:min(920px,calc(100% - 32px));margin:auto;padding:40px 0 72px}.kicker{font-family:Cinzel,serif;letter-spacing:.14em;color:var(--gold);font-weight:700}h1{font-family:Cinzel,serif;font-size:clamp(2rem,7vw,4rem);margin:.45rem 0 1rem}.intro{color:var(--muted);line-height:1.65}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:1.5rem 0}.tab{padding:.9rem .4rem;border:1px solid rgba(201,163,91,.4);background:transparent;color:var(--muted);font-weight:700}.tab.active{border-color:var(--gold);color:var(--gold);background:rgba(201,163,91,.08)}.bar{padding:1rem;border:1px solid rgba(201,163,91,.35);color:var(--gold);font-weight:700}.list{display:grid;gap:1rem;margin-top:1rem}.card{border:1px solid rgba(201,163,91,.38);background:linear-gradient(145deg,rgba(114,18,27,.14),rgba(7,17,22,.96));padding:1.15rem}.meta{display:flex;flex-wrap:wrap;gap:.6rem 1rem;color:var(--gold);font-size:.8rem;font-weight:700}.identity{font-family:Cinzel,serif;font-size:1.2rem;margin:.7rem 0}.message{white-space:pre-wrap;line-height:1.6;color:#ddd3c3}.badge{display:inline-block;margin-top:.9rem;padding:.28rem .5rem;border:1px solid rgba(201,163,91,.5);font-size:.72rem;letter-spacing:.1em;color:var(--gold)}.actions{display:flex;gap:.7rem;margin-top:1rem}.actions button{flex:1;padding:.8rem;border:1px solid var(--gold);background:transparent;color:var(--text);font-weight:700;letter-spacing:.1em}.actions .reject{border-color:#9b4b52;color:#e2b6ba}.empty,#status{color:var(--muted);padding:1rem;border:1px dashed rgba(201,163,91,.3)}@media(max-width:600px){.wrap{width:min(100% - 24px,920px)}.tabs{gap:.3rem}.tab{font-size:.72rem}}
</style></head><body><main class="wrap"><div class="kicker">🐦‍⬛ THE KEEPER'S CHAMBER</div><h1>KEEPER'S INBOX</h1><p class="intro">Private Preview moderation view. Crew Voices remain private here. <strong>Nothing is published automatically.</strong></p><div class="tabs"><button class="tab active" data-view="pending">PENDING <span id="cp">—</span></button><button class="tab" data-view="approved">APPROVED <span id="ca">—</span></button><button class="tab" data-view="rejected">REJECTED <span id="cr">—</span></button></div><div class="bar" id="bar">Opening the message chest…</div><div id="status">Loading…</div><section class="list" id="list"></section></main><script>
const list=document.getElementById('list'),status=document.getElementById('status'),bar=document.getElementById('bar');let data={pending:[],approved:[],rejected:[]},view='pending';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(v).toLocaleString():'—';
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const a=data[view]||[];bar.textContent=`${a.length} ${view.toUpperCase()} MESSAGE${a.length===1?'':'S'} · NO AUTO-PUBLISHING`;list.innerHTML=a.length?a.map((x,i)=>`<article class="card" data-index="${i}"><div class="meta"><span>SUBMITTED ${esc(fmt(x.submittedAt))}</span>${x.decidedAt?`<span>DECIDED ${esc(fmt(x.decidedAt))}</span>`:''}<span>AUTO-PUBLISH: ${x.automaticPublishing?'YES':'NO'}</span></div><div class="identity">${esc(x.identity)}</div><div class="message">${esc(x.message)}</div><span class="badge">${esc(String(x.status||view).toUpperCase())}</span>${view==='pending'?'<div class="actions"><button data-action="approve">APPROVE</button><button class="reject" data-action="reject">REJECT</button></div>':''}</article>`).join(''):'<div class="empty">No messages in this section.</div>';}
async function load(){const r=await fetch('/api/keeper-inbox',{cache:'no-store',headers:{Accept:'application/json'}}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Could not open inbox.');data=d;document.getElementById('cp').textContent=d.counts.pending;document.getElementById('ca').textContent=d.counts.approved;document.getElementById('cr').textContent=d.counts.rejected;status.remove();render();}load().catch(e=>{status.textContent=e.message;});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){view=b.dataset.view;render();}});list.addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const item=data.pending[Number(b.closest('.card').dataset.index)],action=b.dataset.action;if(!confirm(`${action.toUpperCase()} this Crew Voice? This will NOT publish it.`))return;const r=await fetch('/api/keeper-inbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id,action})}),d=await r.json();if(!r.ok||!d.ok){alert(d.error||'Decision failed.');return;}await location.reload();});
</script></body></html>
