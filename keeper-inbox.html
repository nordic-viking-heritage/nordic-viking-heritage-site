<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Keeper's Inbox — Preview</title><style>:root{color-scheme:dark;--bg:#061014;--gold:#c9a35b;--text:#f1eadb;--muted:#b8ae9e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.wrap{width:min(920px,calc(100% - 32px));margin:auto;padding:40px 0 72px}.kicker,h1{font-family:Georgia,serif}.kicker{letter-spacing:.14em;color:var(--gold);font-weight:700}h1{font-size:clamp(2rem,7vw,4rem);margin:.45rem 0 1rem}.intro{color:var(--muted);line-height:1.65}.login{max-width:520px;margin:2rem 0;padding:1.2rem;border:1px solid rgba(201,163,91,.4)}input,button{font:inherit}.login input{width:100%;padding:1rem;background:#09171c;color:var(--text);border:1px solid rgba(201,163,91,.45);margin:.7rem 0}.login button,.actions button,.logout{padding:.85rem;border:1px solid var(--gold);background:transparent;color:var(--text);font-weight:700}.error{color:#e2b6ba}.hidden{display:none!important}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:1.5rem 0}.tab{padding:.9rem .3rem;border:1px solid rgba(201,163,91,.4);background:transparent;color:var(--muted);font-weight:700;font-size:.8rem}.tab.active{color:var(--gold)}.bar,.card{padding:1rem;border:1px solid rgba(201,163,91,.35)}.list{display:grid;gap:1rem;margin-top:1rem}.meta{display:flex;flex-wrap:wrap;gap:.6rem 1rem;color:var(--gold);font-size:.8rem;font-weight:700}.identity{font-family:Georgia,serif;font-size:1.2rem;margin:.7rem 0}.message{white-space:pre-wrap;line-height:1.6}.actions{display:flex;gap:.7rem;margin-top:1rem}.actions button{flex:1}.top{display:flex;justify-content:space-between;gap:1rem;align-items:start}.logout{font-size:.8rem}</style></head><body><main class="wrap"><div class="top"><div><div class="kicker">🐦‍⬛ THE KEEPER'S CHAMBER</div><h1>KEEPER'S INBOX</h1></div><button id="logout" class="logout hidden">SEAL CHAMBER</button></div><p class="intro">Private Preview moderation view. Approval and publication are separate decisions.</p><section id="login" class="login hidden"><strong>THE CHAMBER IS SEALED</strong><p class="intro">Enter the Keeper secret to continue.</p><form id="loginForm"><input id="secret" type="password" autocomplete="current-password" required placeholder="Keeper secret"/><button type="submit">OPEN CHAMBER</button></form><p id="loginError" class="error"></p></section><section id="inbox" class="hidden"><div class="tabs"><button class="tab active" data-view="pending">PENDING <span id="cp">—</span></button><button class="tab" data-view="approved">APPROVED <span id="ca">—</span></button><button class="tab" data-view="published">PUBLISHED <span id="cu">—</span></button><button class="tab" data-view="rejected">REJECTED <span id="cr">—</span></button></div><div class="bar" id="bar">Opening…</div><section class="list" id="list"></section></section><p id="status">Checking the chamber seal…</p></main><script>const login=document.getElementById('login'),inbox=document.getElementById('inbox'),status=document.getElementById('status'),logout=document.getElementById('logout'),list=document.getElementById('list'),bar=document.getElementById('bar');let data={pending:[],approved:[],published:[],rejected:[]},view='pending';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(v).toLocaleString():'—';async function responseData(r){const type=r.headers.get('content-type')||'';if(type.includes('application/json')){try{return await r.json();}catch{}}const text=await r.text().catch(()=> '');return text?{error:text}:{};}function showLogin(){status.classList.add('hidden');inbox.classList.add('hidden');logout.classList.add('hidden');login.classList.remove('hidden');}function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const a=data[view]||[];bar.textContent=`${a.length} ${view.toUpperCase()} MESSAGE${a.length===1?'':'S'} · MANUAL PUBLICATION ONLY`;list.innerHTML=a.length?a.map((x,i)=>`<article class="card" data-index="${i}"><div class="meta"><span>SUBMITTED ${esc(fmt(x.submittedAt))}</span>${x.decidedAt?`<span>DECIDED ${esc(fmt(x.decidedAt))}</span>`:''}${x.publishedAt?`<span>PUBLISHED ${esc(fmt(x.publishedAt))}</span>`:''}<span>AUTO-PUBLISH: ${x.automaticPublishing?'YES':'NO'}</span></div><div class="identity">${esc(x.identity)}</div><div class="message">${esc(x.message)}</div>${view==='pending'?'<div class="actions"><button data-action="approve">APPROVE</button><button data-action="reject">REJECT</button></div>':view==='approved'?'<div class="actions"><button data-action="publish">PUBLISH TO CREW VOICES</button></div>':view==='published'?'<div class="actions"><button data-action="unpublish">UNPUBLISH</button></div>':''}</article>`).join(''):'<div class="card">No messages in this section.</div>';}async function load(){const r=await fetch('/api/keeper-inbox',{cache:'no-store'});if(r.status===401)return showLogin();const d=await responseData(r);if(!r.ok||!d.ok)throw Error(typeof d.error==='string'?d.error:'Could not open inbox.');data=d;cp.textContent=d.counts.pending;ca.textContent=d.counts.approved;cu.textContent=d.counts.published;cr.textContent=d.counts.rejected;status.classList.add('hidden');login.classList.add('hidden');inbox.classList.remove('hidden');logout.classList.remove('hidden');render();}loginForm.addEventListener('submit',async e=>{e.preventDefault();loginError.textContent='';const r=await fetch('/api/keeper-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:document.getElementById('secret').value})});const d=await responseData(r);if(!r.ok){loginError.textContent=r.status===429?'TOO MANY ATTEMPTS. THE CHAMBER REMAINS SEALED. TRY AGAIN SHORTLY.':(typeof d.error==='string'?d.error:'The chamber remains sealed.');return;}document.getElementById('secret').value='';await load();});logout.addEventListener('click',async()=>{await fetch('/api/keeper-auth',{method:'DELETE'});showLogin();});document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){view=b.dataset.view;render();}});list.addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const action=b.dataset.action,item=data[view][Number(b.closest('.card').dataset.index)];const warning=action==='publish'?'PUBLISH this Crew Voice publicly?':action==='unpublish'?'UNPUBLISH this Crew Voice and return it to Approved?':`${action.toUpperCase()} this Crew Voice? This will NOT publish it.`;if(!confirm(warning))return;const r=await fetch('/api/keeper-inbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id,action})});const d=await responseData(r);if(!r.ok){alert(typeof d.error==='string'?d.error:'Action failed.');return;}await load();});load().catch(e=>{status.textContent=e.message;});</script></body></html>
