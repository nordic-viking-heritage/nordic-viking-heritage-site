<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keeper's Inbox — Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#061014;--panel:#0a1117;--gold:#c9a35b;--text:#f1eadb;--muted:#b8ae9e;--red:#72121b}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}.wrap{width:min(920px,calc(100% - 32px));margin:0 auto;padding:40px 0 72px}.kicker{font-family:Cinzel,serif;letter-spacing:.14em;color:var(--gold);font-weight:700;font-size:.86rem}h1{font-family:Cinzel,serif;font-size:clamp(2rem,7vw,4rem);margin:.45rem 0 1rem}.intro{color:var(--muted);line-height:1.65;max-width:720px}.bar{display:flex;justify-content:space-between;gap:1rem;align-items:center;margin:1.4rem 0 1rem;padding:1rem;border:1px solid rgba(201,163,91,.35);background:rgba(201,163,91,.04)}.count{color:var(--gold);font-weight:700}.note{font-size:.9rem;color:var(--muted)}#status{padding:1rem;border:1px solid rgba(201,163,91,.25);color:var(--muted)}.list{display:grid;gap:1rem;margin-top:1rem}.card{border:1px solid rgba(201,163,91,.38);background:linear-gradient(145deg,rgba(114,18,27,.14),rgba(7,17,22,.96));padding:1.15rem}.meta{display:flex;flex-wrap:wrap;gap:.6rem 1rem;color:var(--gold);font-size:.8rem;font-weight:700;letter-spacing:.05em}.identity{font-family:Cinzel,serif;font-size:1.2rem;margin:.7rem 0}.message{white-space:pre-wrap;line-height:1.6;color:#ddd3c3}.pending{display:inline-block;margin-top:.9rem;padding:.28rem .5rem;border:1px solid rgba(201,163,91,.5);font-size:.72rem;letter-spacing:.1em;color:var(--gold)}.actions{display:flex;gap:.7rem;margin-top:1rem}.actions button{flex:1;padding:.8rem;border:1px solid var(--gold);background:transparent;color:var(--text);font:700 .78rem Inter,sans-serif;letter-spacing:.1em}.actions button.reject{border-color:#9b4b52;color:#e2b6ba}.actions button:disabled{opacity:.45}.result{margin-top:.8rem;color:var(--muted);font-size:.86rem;line-height:1.5}.empty{color:var(--muted);padding:1rem;border:1px dashed rgba(201,163,91,.3)}@media(max-width:600px){.bar{align-items:flex-start;flex-direction:column}.wrap{width:min(100% - 24px,920px)}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="kicker">🐦‍⬛ THE KEEPER'S CHAMBER</div>
    <h1>KEEPER'S INBOX</h1>
    <p class="intro">Private Preview moderation view for Crew Voices. Approving a message moves it to the Keeper's approved archive for editorial use; <strong>approval never publishes automatically</strong>.</p>
    <div class="bar"><div class="count" id="count">—</div><div class="note">PREVIEW MODERATION · NO AUTO-PUBLISHING</div></div>
    <div id="status">Opening the message chest…</div>
    <section class="list" id="list" aria-live="polite"></section>
  </main>
  <script>
    const statusEl=document.getElementById('status'),listEl=document.getElementById('list'),countEl=document.getElementById('count');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt=v=>{if(!v)return 'Unknown time';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString();};
    let messages=[];
    const render=()=>{countEl.textContent=`${messages.length} PENDING MESSAGE${messages.length===1?'':'S'}`;if(!messages.length){listEl.innerHTML='<div class="empty">No pending Crew Voices.</div>';return;}listEl.innerHTML=messages.map((item,i)=>`<article class="card" data-index="${i}"><div class="meta"><span>${esc(fmt(item.submittedAt))}</span><span>AUTO-PUBLISH: ${item.automaticPublishing?'YES':'NO'}</span></div><div class="identity">${esc(item.identity)}</div><div class="message">${esc(item.message)}</div><span class="pending">${esc(String(item.status||'pending').toUpperCase())}</span><div class="actions"><button data-action="approve">APPROVE</button><button class="reject" data-action="reject">REJECT</button></div><div class="result" aria-live="polite"></div></article>`).join('');};
    fetch('/api/keeper-inbox',{headers:{Accept:'application/json'},cache:'no-store'}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Could not open inbox.');return d;}).then(data=>{statusEl.remove();messages=data.messages||[];render();}).catch(err=>{statusEl.textContent=err.message;countEl.textContent='INBOX UNAVAILABLE';});
    listEl.addEventListener('click',async e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const card=btn.closest('.card'),i=Number(card.dataset.index),item=messages[i],action=btn.dataset.action;if(!item)return;const verb=action==='approve'?'approve':'reject';if(!confirm(`${verb.toUpperCase()} this Crew Voice? This will move it out of Pending but will NOT publish it.`))return;const buttons=[...card.querySelectorAll('button')],result=card.querySelector('.result');buttons.forEach(b=>b.disabled=true);result.textContent='The Keeper is recording the decision…';try{const r=await fetch('/api/keeper-inbox',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({id:item.id,action})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Decision failed.');result.textContent=d.message;setTimeout(()=>{messages.splice(i,1);render();},650);}catch(err){result.textContent=err.message;buttons.forEach(b=>b.disabled=false);}});
  </script>
</body>
</html>
