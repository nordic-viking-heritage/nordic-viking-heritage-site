name: Extract Ship Roll for Admin
on:
  push:
    branches: [admin-captains-log-v1]
    paths: ['.github/workflows/extract-ship-roll-admin.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract canonical public Ship Roll
        run: |
          python - <<'PY'
          import re, html
          s=open('index.html',encoding='utf-8').read()
          m=re.search(r'<section class="ship-roll" id="ship-roll">.*?<div class="roll-grid">(.*?)</div>',s,re.S)
          if not m: raise SystemExit('ship roll not found')
          rows=[]
          for a in re.findall(r'<article>(.*?)</article>',m.group(1),re.S):
              name=re.search(r'<span>(.*?)</span>',a,re.S)
              vik=re.search(r'<strong>(.*?)</strong>',a,re.S)
              old=re.search(r'<small class="old-norse">(.*?)</small>',a,re.S)
              runes=re.search(r'<small class="runes">(.*?)</small>',a,re.S)
              if all((name,vik,old,runes)):
                  clean=lambda x: html.unescape(re.sub('<.*?>','',x.group(1))).strip()
                  rows.append('\t'.join(map(clean,(name,vik,old,runes))))
          open('admin/ship-roll-source.tsv','w',encoding='utf-8').write('Pacer name\tViking name\tOld Norse\tRunes\n'+'\n'.join(rows)+'\n')
          print('rows',len(rows))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/ship-roll-source.tsv
          git commit -m "Extract canonical Ship's Roll source"
          git push
