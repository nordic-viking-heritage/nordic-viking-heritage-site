name: Voyage Archive Image Crop Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-day26.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tune archive image framing
        run: |
          printf '\n/* VOYAGE ARCHIVE — mobile-friendly image framing */\n#voyage-archive .archive-day-image img{object-fit:cover}\n#voyage-archive .archive-day:nth-child(1) .archive-day-image img{object-position:50%% 28%%}\n#voyage-archive .archive-day:nth-child(2) .archive-day-image img{object-position:46%% 34%%}\n@media(max-width:520px){#voyage-archive .archive-day:nth-child(1) .archive-day-image img{object-position:52%% 25%%}#voyage-archive .archive-day:nth-child(2) .archive-day-image img{object-position:44%% 32%%}}\n' >> styles.css
      - name: Verify only stylesheet changed
        run: |
          test "$(git diff --name-only)" = "styles.css"
          grep -q 'VOYAGE ARCHIVE — mobile-friendly image framing' styles.css
          grep -q 'object-position:52% 25%' styles.css
          grep -q 'object-position:44% 32%' styles.css
          git diff --exit-code -- index.html
      - name: Commit isolated archive crop fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Tune Voyage Archive image framing"
          git push
