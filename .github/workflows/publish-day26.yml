name: Publish Day 26
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-day26.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply protected Day 26 update
        run: python3 scripts/publish_day26.py
      - name: Verify only index is changed by publication
        run: |
          test "$(git diff --name-only)" = "index.html"
          grep -q "THE SHIP'S LOG — DAY 26" index.html
          grep -q 'id="keepers-chamber"' index.html
          grep -q 'archive/day-26.html' index.html
          grep -q 'day-26-crew-honors.jpg' index.html
          grep -q 'day-26-night-watch.jpg' index.html
      - name: Commit protected Day 26 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish Day 26 website update"
          git push
