name: Publish Day 26
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-day26.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Day 26 update
        run: python3 scripts/publish_day26.py
      - name: Validate locked website structure
        run: python3 scripts/validate_site_structure.py
      - name: Commit verified Day 26 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish Day 26 website update"
          git push
