name: Day 26 Myth Spacing Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-day26.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add isolated Day 26 Myth and Saga spacing
        run: |
          printf '\n/* DAY 26 — balanced Myth & Saga chapter spacing */\n#myth-day-26{padding-top:76px;padding-bottom:76px}\n@media(max-width:520px){#myth-day-26{padding-top:64px;padding-bottom:64px}}\n' >> styles.css
      - name: Verify only stylesheet changed
        run: |
          test "$(git diff --name-only)" = "styles.css"
          grep -q '#myth-day-26{padding-top:76px;padding-bottom:76px}' styles.css
          grep -q '@media(max-width:520px){#myth-day-26{padding-top:64px;padding-bottom:64px}}' styles.css
          git diff --exit-code -- index.html
      - name: Commit isolated spacing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Add balanced spacing to Day 26 Myth and Saga"
          git push
