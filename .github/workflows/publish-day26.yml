name: Voyage Archive Image Framing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-day26.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extend safe framing to all Voyage Archive images
        run: |
          printf '\n/* VOYAGE ARCHIVE — safe framing for every archive card */\n#voyage-archive .archive-day-image img{width:100%%;height:100%%;object-fit:cover;object-position:50%% 38%%}\n#voyage-archive .archive-day:nth-child(1) .archive-day-image img{object-position:52%% 25%%}\n#voyage-archive .archive-day:nth-child(2) .archive-day-image img{object-position:44%% 32%%}\n@media(max-width:520px){#voyage-archive .archive-day-image img{object-position:50%% 34%%}#voyage-archive .archive-day:nth-child(1) .archive-day-image img{object-position:52%% 25%%}#voyage-archive .archive-day:nth-child(2) .archive-day-image img{object-position:44%% 32%%}}\n' >> styles.css
      - name: Verify only stylesheet changed
        run: |
          test "$(git diff --name-only)" = "styles.css"
          grep -q 'VOYAGE ARCHIVE — safe framing for every archive card' styles.css
          grep -q 'object-position:50% 38%' styles.css
          grep -q 'object-position:50% 34%' styles.css
          git diff --exit-code -- index.html
      - name: Commit isolated archive framing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Improve framing for all Voyage Archive images"
          git push
