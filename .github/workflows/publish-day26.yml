name: Add Chapter III Completion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-day26.yml']
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert Chapter III after Chapter II only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="chapter-three-complete"' in s:
              raise SystemExit('Chapter III already exists')
          chapter2='<section class="dark-section" id="chapter-two-complete"><div class="wrap"><div class="copy"><div class="kicker gold">VIKING VOYAGE II — CHAPTER II</div><h2>NEWFOUNDLAND REACHED</h2><p>From the North American mainland, the fleet turned east toward Newfoundland.</p><p>On Day 18, <strong>89 Vikings</strong> carried the voyage to <strong>30,701,056 steps</strong> — approximately <strong>19,955.7 km</strong> since Greenland.</p><p>The fleet reached Newfoundland. Chapter II was complete and the chapter was frozen into the voyage record.</p><p><strong>CHAPTER II IS COMPLETE.<br>CHAPTER III AWAITS.</strong></p></div></div></section>'
          chapter3='<section class="dark-section" id="chapter-three-complete"><div class="wrap"><div class="copy"><div class="kicker gold">VIKING VOYAGE II — CHAPTER III</div><h2>NOVA SCOTIA REACHED</h2><p>From Newfoundland, the fleet continued south toward Nova Scotia.</p><p>On Day 26, <strong>103 Vikings</strong> carried the voyage to <strong>50,647,198 steps</strong> — approximately <strong>32,920.7 km</strong> since Greenland.</p><p>The fleet reached Nova Scotia. Chapter III was complete and the chapter was frozen into the voyage record.</p><p><strong>CHAPTER III IS COMPLETE.<br>CHAPTER IV AWAITS.</strong></p></div></div></section>'
          if s.count(chapter2)!=1:
              raise SystemExit('Exact locked Chapter II marker not found once')
          before=s
          s=s.replace(chapter2,chapter2+'\n'+chapter3,1)
          if s.replace('\n'+chapter3,'',1)!=before:
              raise SystemExit('Unexpected content changed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify surgical change
        run: |
          test "$(git diff --name-only)" = "index.html"
          grep -q 'id="chapter-three-complete"' index.html
          grep -q 'CHAPTER III IS COMPLETE.<br>CHAPTER IV AWAITS.' index.html
          grep -q '50,647,198 steps' index.html
          git diff --exit-code -- styles.css
      - name: Commit Chapter III milestone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add completed Chapter III milestone"
          git push
