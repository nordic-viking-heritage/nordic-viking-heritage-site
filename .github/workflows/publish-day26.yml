name: Day 26 Myth Background Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-day26.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply isolated Day 26 Myth and Saga background
        run: |
          printf '\n/* DAY 26 — isolated Myth & Saga chapter contrast */\n#myth-day-26{background:#10191c;color:#eae6dc;border-top:1px solid rgba(199,164,92,.30);border-bottom:1px solid rgba(199,164,92,.22)}\n#myth-day-26 .red{color:#c45a48}\n' >> styles.css
      - name: Verify only stylesheet changed
        run: |
          test "$(git diff --name-only)" = "styles.css"
          grep -q '#myth-day-26{background:#10191c' styles.css
          git diff --exit-code -- index.html
      - name: Commit isolated style fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Separate Day 26 Myth and Saga background"
          git push
