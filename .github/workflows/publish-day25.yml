name: Publish Day 25

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-day25.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Day 25 update
        run: python3 scripts/publish_day25.py

      - name: Validate locked website structure
        run: python3 scripts/validate_site_structure.py

      - name: Commit verified Day 25 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive/day-25.html scripts/validate_site_structure.py
          git commit -m "Publish Day 25 website update"
          git push