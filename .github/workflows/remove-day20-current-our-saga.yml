name: Remove Day 20 from current Our Saga

on:
  push:
    paths:
      - '.github/workflows/remove-day20-current-our-saga.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale Day 20 Our Saga
        run: python scripts/remove_day20_current_our_saga.py

      - name: Validate permanent site structure
        run: python scripts/validate_site_structure.py

      - name: Commit cleanup
        run: |
          if git diff --quiet -- index.html; then
            echo "No cleanup needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep only Day 21 in current Our Saga"
          git push
