name: Fix Day 9 map asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-day9-map.yml'
      - 'master-map-day-9-fixed.b64.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode-map:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode Day 9 map
        run: |
          base64 --decode master-map-day-9-fixed.b64.txt > master-map-day-9.jpg
          file master-map-day-9.jpg
          test -s master-map-day-9.jpg
      - name: Commit corrected map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master-map-day-9.jpg
          if git diff --cached --quiet; then
            echo "Map already correct."
          else
            git commit -m "Fix Day 9 master map image"
            git push origin main
          fi
