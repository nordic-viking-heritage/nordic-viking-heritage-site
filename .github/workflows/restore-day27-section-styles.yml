name: Restore Day 27 section styles
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-day27-section-styles.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore approved Day 27 History spacing and Myth Saga contrast
        run: |
          printf '\n/* DAY 27 — approved History spacing */\n#history-day-27{padding-top:76px;padding-bottom:76px}\n@media(max-width:520px){#history-day-27{padding-top:64px;padding-bottom:64px}}\n\n/* DAY 27 — approved Myth & Saga chapter contrast */\n#myth-day-27{background:#10191c;color:#eae6dc;border-top:1px solid rgba(199,164,92,.30);border-bottom:1px solid rgba(199,164,92,.22);padding-top:76px;padding-bottom:76px}\n#myth-day-27 .red{color:#c45a48}\n@media(max-width:520px){#myth-day-27{padding-top:64px;padding-bottom:64px}}\n' >> styles.css
      - name: Verify isolated stylesheet change
        run: |
          test "$(git diff --name-only)" = "styles.css"
          grep -q '#history-day-27{padding-top:76px' styles.css
          grep -q '#myth-day-27{background:#10191c' styles.css
          git diff --exit-code -- index.html
      - name: Commit restored Day 27 styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Restore Day 27 History spacing and Myth Saga contrast"
          git push
# trigger approved restoration
