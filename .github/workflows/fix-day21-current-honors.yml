name: Fix Day 21 current Crew Honors

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-day21-current-honors.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace current Crew Honors with Day 21
        run: python3 scripts/fix_day21_current_honors.py

      - name: Validate locked website structure
        run: python3 scripts/validate_site_structure.py

      - name: Commit verified Crew Honors correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Day 21 current Crew Honors replacement"
          git push
