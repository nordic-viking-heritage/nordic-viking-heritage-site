name: Restore approved permanent site structure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-approved-structure.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved restoration
        run: python3 scripts/restore_approved_structure.py

      - name: Keep Voyage Archive artwork consistent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # The daily Viking Dispatch visual tradition began on Day 6.
          # Days 1-5 intentionally retain the shared opening artwork.
          images = {
              20: 'day-20-viking-dispatch.jpg',
              19: 'day-19-viking-dispatch.jpg',
              18: 'day-18-viking-dispatch.png',
              17: 'day-17-viking-dispatch.png',
              16: 'day-16-viking-dispatch.png',
              15: 'day-15-viking-dispatch.jpg',
              14: 'day-14-viking-dispatch.jpg',
              13: 'day-13-viking-dispatch.jpg',
              12: 'day-12-viking-dispatch.jpg',
              11: '3603CAC6-D075-49DC-A4AC-C0DA57129282.png',
              10: 'day-10-dispatch.jpg',
              9: 'day-9-dispatch.jpg',
              8: 'day-8-dispatch.jpg',
              7: 'day-7-dispatch.jpg',
              6: 'viking-dispatch-day-6.png',
              5: 'archive-prologue-day1-5.jpg',
              4: 'archive-prologue-day1-5.jpg',
              3: 'archive-prologue-day1-5.jpg',
              2: 'archive-prologue-day1-5.jpg',
              1: 'archive-prologue-day1-5.jpg',
          }

          for day, image in images.items():
              if not Path(image).exists():
                  raise SystemExit(f'Missing approved archive artwork: {image}')
              pattern = re.compile(
                  rf'(<a class="archive-day" href="archive/day-{day}\.html">.*?'
                  rf'<div class="archive-day-image"><img src=")[^"]+(" alt="Day {day} voyage archive")',
                  re.S,
              )
              text, count = pattern.subn(rf'\g<1>{image}\g<2>', text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not safely update Voyage Archive artwork for Day {day}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Preserve Crew Honors breathing room
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('styles.css')
          css = path.read_text(encoding='utf-8')
          rule = '#honors .framed + .naming-list{margin-top:32px}'
          if rule not in css:
              css += '\n' + rule + '\n'
          path.write_text(css, encoding='utf-8')
          PY

      - name: Commit restored structure
        run: |
          if git diff --quiet -- index.html styles.css; then
            echo "No site changes required."
            exit 0
          fi
          git config user.name "nordic-viking-heritage"
          git config user.email "nkfrhf5h7b@privaterelay.appleid.com"
          git add index.html styles.css
          git commit -m "Restore approved permanent website structure"
          git push
