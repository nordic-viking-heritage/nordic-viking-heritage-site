name: Verify approved permanent site structure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate locked website structure
        run: python3 scripts/validate_site_structure.py

      - name: Confirm no legacy runtime overlays are active
        run: |
          if grep -Eq '<script[^>]+src=["'"'][^"'"']*(site\.js|day16\.js)["'"']' index.html; then
            echo "Legacy runtime overlay detected"
            exit 1
          fi

      - name: Confirm repository stayed unchanged
        run: git diff --exit-code
