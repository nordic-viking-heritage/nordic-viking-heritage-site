<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crew Voices — Nordic Viking Heritage</title><style>:root{color-scheme:dark;--bg:#061014;--gold:#c9a35b;--text:#f1eadb;--muted:#b8ae9e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#10242a 0,#061014 55%);color:var(--text);font-family:system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:auto;padding:55px 0 90px}.kicker,h1,.name{font-family:Georgia,serif}.kicker{color:var(--gold);letter-spacing:.16em;font-weight:700}h1{font-size:clamp(2.7rem,10vw,5.5rem);margin:.35rem 0}.intro{color:var(--muted);line-height:1.7;max-width:700px}.voices{display:grid;gap:1rem;margin-top:2.4rem}.voice{border:1px solid rgba(201,163,91,.35);padding:1.3rem;background:rgba(9,23,28,.72)}.name{font-size:1.25rem;color:var(--gold)}.message{white-space:pre-wrap;line-height:1.7;margin:.7rem 0}.date{font-size:.78rem;color:var(--muted);letter-spacing:.08em}.empty{border:1px solid rgba(201,163,91,.3);padding:1.3rem;color:var(--muted)}</style></head><body><main class="wrap"><div class="kicker">⚔ NORDIC VIKING HERITAGE</div><h1>CREW VOICES</h1><p class="intro">Words carried from the crew and chosen by the Keepers to enter our shared voyage. Every voice shown here has been reviewed before publication.</p><section id="voices" class="voices"><div class="empty">Listening for voices from the ship…</div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(v).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}):'';fetch('/api/crew-voices-public',{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok||!d.ok)throw Error();const el=document.getElementById('voices');el.innerHTML=d.voices.length?d.voices.map(x=>`<article class="voice"><div class="name">${esc(x.identity)}</div><div class="message">${esc(x.message)}</div><div class="date">${esc(fmt(x.publishedAt||x.submittedAt))}</div></article>`).join(''):'<div class="empty">No Crew Voices have been published yet.</div>';}).catch(()=>document.getElementById('voices').innerHTML='<div class="empty">The voices cannot be reached right now.</div>');</script></body></html>
